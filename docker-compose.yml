services:
  traefik:
    image: traefik:v2.10
    container_name: youth_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - youth_net

  api:
    image: docker.lthome.us:5000/youth-permission-tracker/youth-api:latest
    container_name: youth_api_test
    environment:
      ENV: "test"
      BASE_URL: "api-youth.centervillenorthstake.com"
      DB_PATH: "/data/data.sqlite3"
    volumes:
      # Persistent SQLite file lives on the host at ./data/sqlite/data.sqlite3
      - ./data/sqlite:/data
    networks:
      - youth_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api-youth.centervillenorthstake.com`)"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  web:
    image: docker.lthome.us:5000/youth-permission-tracker/youth-web:latest
    container_name: youth_web_test
    environment:
      ENV: "test"
      env: "test"
      BASE_URL: "brookhurst.centervillenorthstake.com"
      API_BASE_URL: "http://api:8000"
      API_BASE: "http://api:8000"
    depends_on:
      - api
    networks:
      - youth_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`brookhurst.centervillenorthstake.com`, `bh.centervillenorthstake.com`)"
      - "traefik.http.routers.web.entrypoints=web,websecure"
      - "traefik.http.services.web.loadbalancer.server.port=80"

networks:
  youth_net:
    driver: bridge
